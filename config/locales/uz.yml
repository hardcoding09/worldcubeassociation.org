  merch:
      title: 'WCA tovarlari'
      paragraphs:
        '1': 'WCA ning sotib olish mumkin bo''lgan eksklyuziv tovarlari bor! Futbolkalar, xudilar, stikerlar, stakmatlar, ryukzaklar va boshqalar! Bizning dizaynlarimiz doimiy ravishda yangilanadi, jumladan klassik WCA logotipi, rasmiy Jahon chempionati tovarlari va Jahon rekordi dizaynlari.'
        '2': 'Bizning do''konlarimiz orqali WCA tovarlarini sotib olish WCA ni — notijorat, ko''ngillilar tomonidan boshqariladigan tashkilotni qo''llab-quvvatlashning eng yaxshi usullaridan biridir. Biz tovarlardan olingan barcha foydani chempionatlarni, jihozlarni va boshqa WCA bilan bog''liq faoliyatlarni moliyalashtirish uchun ishlatamiz.'
        '3': 'Tovarlarimizni butun dunyo bo''ylab sotib olishingiz mumkin — Yevropa, Amerika va Hindistonda to''g''ridan-to''g''ri do''konlar bilan va yaqin orada yana ko''proq!'
  database:
    results_export:
      heading: "WCA natijalar eksporti"
      deprecation_warning: "BEKOR QILISH OGOHLANTIRISHI: Natijalar eksportining %{old_version} versiyasi eskirgan va uni qo'llab-quvvatlash %{deprecation_date} dan to'xtatiladi. Iltimos, shu vaqtgacha %{new_version} versiyasidan foydalanishga o'ting."
      description: "Bu sahifada biz WCA natijalarini bir nechta formatlarda yuklab olishni taklif qilamiz, shunda siz ulardan keng ko'lamda foydalanishingiz/tahlil qilishingiz mumkin. Odatda har bir musobaqa dam olish kunidan keyin natijalar yakunlanganda yangilaymiz. Fayllar raqamlangan va sanasi ko'rsatilgan, shunda siz eng yangi versiyaga ega ekanligingizni ko'rishingiz mumkin."
      permalink: "doimiy havola"
      permalink_note: "Eslatma: Doimiy havolalar ma'lum bir versiyadagi eng so'nggi natijalar eksportini taqdim etadi — ya'ni, v2 doimiy havolasi eng so'nggi v2 eksportini qaytaradi, lekin v3 chiqarilganda ham v2 da qoladi."
      file_formats:

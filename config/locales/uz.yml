    how_to:
      title: "Qanday qilib tan olingan WCA Hududiy tashkilotiga aylanish mumkin"
      description: "WCA butun dunyo bo'ylab turli Hududiy tashkilotlarni tan oladi. WCA Hududiy tashkilotining maqsadi WCA musobaqalarini tashkil qilish va mintaqada WCA faoliyatini qo'llab-quvvatlashdir. Hududiy tashkilot tuzmoqchi bo'lgan hududlar arizalarini topshirishdan oldin o'z hududlarida WCA ga hissa qo'shishga da'vat etiladi. O'z hududingizda WCA musobaqasini tashkil qilishda yordam uchun iltimos, eng yaqin WCA delegatingiz bilan bog'laning."
    requirements:

  media_and_instagram:
    page_title: "Media va Instagram topshirish"
    general_media_submission:
      title: "Umumiy media topshirish"
      body_html: 'WCA hamjamiyat tomonidan taqdim etilgan musobaqalardan maqolalar va rasmlarni <a href="/media">media sahifamizda</a> baham ko''radi. Agar sizda baham ko''rishni xohlagan narsangiz bo''lsa, iltimos, <a href="/media/new">umumiy media topshirish formamizni</a> to''ldiring!'
    instagram_submission:
      title: "Instagram topshirish"
      paragraph1_html: 'Ko''rganingizdek, WCA ning <a href="https://www.instagram.com/thewcaofficial/">faol Instagram sahifasi</a> bor! Global kub hamjamiyatini eng yaxshi aks ettirish uchun biz butun dunyo bo''ylab kuberlar tomonidan bizga yuborilgan kontentni joylashtiramiz.'
      paragraph2: "Agar siz biz joylashtirishimizni xohlagan yuqori sifatli foto yoki videolaringiz bo'lsa, iltimos, quyidagi tugmani bosing va formani to'ldiring! Kontentingizni joylashtirishimiz uchun siz unga egalik qilishingiz va WCA ga uni joylashtirish uchun ruxsat berishingiz kerak. Biz oladigan topshiriqlarning ko'pligi sababli hammasini joylashtira olmaymiz, lekin kontentingizni joylashtirish uchun bir nechta maslahatlar:"
      photo_quality: "Foto/video sifati yaxshi ekanligiga ishonch hosil qiling. Professional suratga olish shart emas, lekin sifat foto yoki videoga zarar bermasligi kerak."
      photo_interest: "Kontentingizni keng auditoriya uchun qiziqarli qilishga harakat qiling. Faqat bir necha kishi uchun qiziqarli bo'lgan kontent bu yerga tegishli emas."
      wca_related: "WCA bilan bog'liq foto va videolarni joylashtiring, chunki bizning hisobimiz aynan shu haqida! Biz kuberlarning zavqlanayotganini ko'rishni yaxshi ko'ramiz!"
      submit_instagram_content: "Instagram kontentini yuborish"
    instagram_hosting:
      title: "Instagram hosting"
      paragraph1_html: 'Ba''zan biz hamjamiyat a''zolariga ular qatnashayotgan musobaqa bilan rasmiy WCA Instagram hikoyasini olib borishga ruxsat beramiz! Agar qiziqsangiz, iltimos, tugmani bosing va quyidagi formani to''ldiring. Agar hosting uchun tasdiqlansangiz, barcha ma''lumotlar topshirilgandan so''ng WCA Kommunikatsiya jamoasi siz bilan bog''lanadi. Agar savollaringiz bo''lsa, iltimos, <a href="https://www.worldcubeassociation.org/contact/website">biz bilan bog''laning</a>.'
      paragraph2: "Bizning maqsadimiz har bir kuberning va har bir musobaqaning bir oz shaxsiy tomonini baham ko'rishdir. Bu dam olish kunlari uchun katta yuk bo'lishi kerak emas va, albatta, biz sizning avval musobaqadan zavqlanishingizni, keyin uni baham ko'rishingizni xohlaymiz."
      paragraph3: "Host rolini quyidagicha umumlashtirish mumkin:"
      short_intro: "Qisqa tanishuv qiling, o'zingiz va musobaqa haqida gapiring"
      venue_feel: "Joy va odamlar haqida tasavvur hosil qilish uchun bir nechta kliplar oling, bu shunchaki ishtirokchilar maydoni va yechish maydonidan olingan surat bo'lishi mumkin"
      people_solving: "Odamlarning yechayotganidan bir nechta suratga olishga harakat qiling (afzalroq asosiy yo'nalishlarida tez odamlarni)"
      mini_interviews: "Odamlardan (tashkilotchilar, delegatlar va h.k.) musobaqa haqida nima his qilayotganlarini aytib beradigan mini intervyular olishga harakat qilishingiz mumkin"
      pictures_too: "Siz rasmlarni ham yuborishingiz mumkin, bu faqat videolar bo'lishi shart emas"
      paragraph4: "Dam olish kunlari davomida bizning aloqalarimiz odatda WhatsApp guruhi orqali amalga oshiriladi. Iltimos, bu xabar almashish platformasi bilan tanish ekanligingizga ishonch hosil qiling yoki undan foydalana olmasangiz, bizga xabar bering, shunda boshqa rejalarni kelishib olamiz."
      apply_to_host: "Host bo'lish uchun ariza berish"
    other_suggestions:
      title: "Boshqa takliflar?"
      body_html: 'Instagram yoki boshqa ijtimoiy media kontenti uchun boshqa takliflaringiz bormi? <a href="https://www.worldcubeassociation.org/contact/website">Bizga xabar bering</a>!'

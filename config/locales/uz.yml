  #context: On the page describing software tools for WCA competitions
  score_tools:
    title: "WCA musobaqalari uchun dasturiy vositalar"
    wca_icon_text: "WST tomonidan ishlab chiqilgan va qo'llab-quvvatlanadi"
    intro:
      desc: "Bu sahifa WCA musobaqalarini tashkil qilishda yordam berish uchun ishlatilishi ma'lum bo'lgan vositalarning to'liq bo'lmagan ro'yxatidir."
      disclaimer: "Bu sahifadagi barcha vositalar WST tomonidan qo'llab-quvvatlanmaydi: bu mutlaqo normal! Bizda mavjud bo'lgan barcha WCA bilan bog'liq dasturiy ta'minotni boshqarish uchun yetarli kuch yo'q :)"
      used: "Bu ro'yxatdagi barcha dasturlar haqiqiy WCA musobaqalarida ishlatilgan va WCA veb-sayti bilan integratsiyalashgan: ular sizga yaqinlashib kelayotgan musobaqa ma'lumotlarini import qilish (va ba'zan yangilash) uchun WCA hisobingiz bilan kirish imkonini beradi. Ularning har biri uchun qo'llab-quvvatlovchi(lar) aniq yoziladi."
    #context: tools used before the competition
    before:
      title: "Musobaqadan oldin"
      desc: "Ishtirokchilarning ro'yxatdan o'tishini boshqarish to'g'ridan-to'g'ri WCA veb-saytida amalga oshirilishi mumkin. Guruhlar va ko'ngillilarni qo'lda boshqarish vaqt talab qilishi mumkinligi sababli, quyidagi vositalardan birini ishlatishni o'ylab ko'rishingiz mumkin."
    #context: tools used during the competition
    during:
      title: "Musobaqa davomida"
      desc: "Bu yerda musobaqa davom etayotganda natijalarni boshqarish imkonini beruvchi vositalarni topasiz."
    #context: tools used after the competition
    after:
      title: "Musobaqadan keyin"
      desc: "Natijalarni tekshirish to'g'ridan-to'g'ri veb-saytda amalga oshirilsa-da, TNoodle tomonidan yaratilgan skrambllarni WCA veb-saytiga topshirilgan haqiqiy natijalarga biriktirish uchun qandaydir vositadan foydalanishingiz kerak bo'ladi."
    #context: part of the description of a program
    tools:
      age:
        title: "AGE"
        description: "WCA musobaqalari uchun guruhlar/vazifalar tayinlashni yaratish va tahrirlash vositasi"
      certificates:
        title: "Sertifikatlar"
        description: "WCA Live dan foydalanib WCA musobaqalari uchun sertifikatlarni chop etish"
      groupifier:
        title: "Groupifier"
        description: "WCA musobaqa tashkilotchilari uchun vazifa va guruhlarni boshqarish vositasi. Asosiy xususiyatlar orasida: ishtirokchilarni reytinglar bo'yicha saralash, vazifalarni tayinlash (hakamlik, skrambl), qancha skrambl kerakligini aniqlash, natija varaqlari, shaxsiy varaqlar va xulosalarni yaratish... Batafsil ma'lumot uchun veb-saytga tashrif buyuring."
      scorecards:
        title: "Natija varaqlari"
        description: "WCA Live dan foydalanib WCA musobaqalari uchun natija varaqlarini chop etish"
      tnoodle:
        title: "TNoodle (Skrambllar)"
        description: "TNoodle — WCA musobaqalari uchun ishlatiladigan rasmiy skrambl dasturi. Odatda WCA delegatlari tomonidan WCA musobaqalaridan oldin ishlatiladi, lekin uning foydalanuvchi interfeysi har kimga barcha WCA yo'nalishlari uchun har qanday turdagi skrambllarni yaratish imkonini beradi."
      live:
        title: "WCA Live"
        description: "WCA musobaqalarini o'tkazish va jonli natijalarni dunyo bilan bo'lishish uchun platforma."
      nightmare:
        title: "Natijalar jadvali"
        description: "Ba'zan shunday holatlar bo'ladi... Agar tarmoqqa kirish imkoningiz bo'lmasa, eski yaxshi jadvaldan foydalanishingiz kerak bo'ladi."
      matcher:
        title: "Skrambllarni moslashtiruvchi"
        description: "TNoodle tomonidan yaratilgan skrambllarni natijalarga biriktirish uchun ishlatilishi mumkin. WCA veb-saytidan (WCA Live dan foydalanilganda), jadvaldan yoki mustaqil WCIF faylidan natijalarni import qiling. Bir yoki bir nechta TNoodle json fayl(lar)idan skrambllarni import qiling. Natijalarni WCA topshirish uchun tegishli formatga eksport qiling."
      groups:
        title: "Musobaqa guruhlari"
        description: "Har qanday davom etayotgan musobaqaning guruhlarini ko'rish"
  logo:

        incidents: "Iltimos, nostandart holatlar bo'lgan barcha hodisalar haqida xabar bering. Hodisalarni 1.dan boshlab raqamlang, shunda boshqa delegatlar ularning raqamlariga murojaat qilib izoh berishlari mumkin. Hatto hamma narsa oddiy ko'ringan bo'lsa ham, hech bo'lmaganda eng diqqatga sazovor holatlarni sanab o'ting. Agar siz faol ravishda fikr-mulohaza izlayotgan bo'lsangiz, quyidagi tegishli katakchalarni belgilang."
        setup_images: "Siz joriy musobaqadan skrambl va musobaqa maydonlarini tasvirlaydigan kamida %{image_count} ta rasmni kiritishingiz SHART, afzalroq musobaqa davomida (boshqa rasmlar ham qabul qilinadi). Bir vaqtning o'zida bir nechta faylni tanlashingiz mumkin. Rasmlarni faqat yetarli miqdorda boshqa rasmlar yuklangandan keyin o'chirishingiz mumkin (agar rasmni almashtirmoqchi bo'lsangiz, avval yangisini yuklashingiz, keyin eskisini o'chirishingiz kerak). Agar sizda musobaqa maydoni va/yoki skrambl maydonining foydalanish paytidagi joriy rasmlari bo'lmasa, sababini tushuntiring."
        wrc_incidents: "WRC ning fikr-mulohazasini olishni xohlagan hodisalaringizga havola qiluvchi raqamlar ro'yxati."
        wic_incidents_html: "WIC ning fikr-mulohazasini olishni xohlagan hodisalaringizga havola qiluvchi raqamlar ro'yxati. <br> <strong>%{wic_incident_alert}</strong>"
        wic_incident_alert: "Agar WIC hodisasi nozik bo'lsa (jumladan, lekin ular bilan cheklanmagan holda jinoyatlar, ta'qib, hujum va h.k.), iltimos, buni hisobotingizdan chiqarib tashlang va WIC ga alohida email yuboring. Boshqa WIC hodisalari uchun hodisaning qisqa, anonimlashtirilgan versiyasini yuboring va WIC bilan qo'shimcha tafsilotlarni alohida muhokama qiling. WIC baribir umumiy xabardorlik uchun anonimlashtirilgan versiyalar bo'yicha fikr-mulohaza beradi. WCA ko'ngillisi bilan bog'liq barcha WIC hodisalari uchun barcha tafsilotlarni hisobotdan chiqarib tashlang va WIC bilan alohida bog'laning."
        remarks: "Baham ko'rmoqchi bo'lgan boshqa har qanday tafsilot haqida gapiring (masalan, hamjamiyatdagi yaxshilanish/regressiya, bu hudud uchun kelajak rejalari). Agar qisqalik uchun oldingi bo'limlarda aytilmagan narsa qolgan bo'lsa, bu yerda izoh berishingiz mumkin."

  #context: About the regulations
  about_regulations:
    title: "Qoidalar haqida"
    panel1:
      title: "Qoidalar"
      content1_html: 'Barcha musobaqalar <a href="/regulations/">WCA Qoidalariga</a> amal qilishi kerak. Ishtirokchilar birinchi musobaqasida qatnashishdan oldin bu qoidalarni o''qib chiqishlari muhim.'
      content2_html: 'WCA Qoidalar qo''mitasi tomonidan hal qilingan musobaqalarda sodir bo''lgan hodisalar haqidagi muhim qarorlar <a href="/incidents">Hodisalar jurnalida</a> topiladi.'
    panel2:
      title: "Tarjimalar"
      content1_html: 'WCA Qoidalari nafaqat ingliz tilida mavjud, balki WCA a''zolari ularni bir nechta tillarga tarjima qilishgan: <a href="/regulations/translations/">Tarjimalar</a>.'
      content2_html: '<strong>Muhim</strong>: Tarjimalar juda foydali bo''lsa-da, ular rasmiy emas. Musobaqalarda WCA Qoidalarining ingliz tilidagi versiyasi majburiydir.'
    panel3:
      title: "Qoidalar bo'yicha ko'p beriladigan savollar"
      content1_html: '<a href="/faq">Ko''p beriladigan savollar bo''limi</a> WCA Qoidalari haqidagi bir nechta tez-tez so''raladigan savollarga javob beradi.'
    panel4:
      title: "Tashkilotchi qo'llanmasi"
      content1_html: 'Agar siz musobaqa tashkil qilishga qiziqsangiz yoki allaqachon tashkil qilishni rejalashtirayotgan bo''lsangiz, iltimos, <a href="https://documents.worldcubeassociation.org/edudoc/organizer-handbook/organizer-handbook.pdf">Tashkilotchi qo''llanmamizni</a> o''qing.'
      content2_html: "Bu hujjat muhim ma'lumotlarni o'z ichiga oladi va har bir musobaqa tashkilotchisi tomonidan o'qilishi kerak."
  #context: Translations of the regulations
  regulations_translations:
    title: 'WCA Qoidalari: Tarjimalar'
    paragraph1: "Agar siz ingliz tilidan boshqa tilda so'zlashsangiz, bu tarjimalar sizga foydali bo'lishi mumkin."
    paragraph2: "Shuni yodda tutingki, tarjimalar WCA veb-saytida taqdim etilgan bo'lsa-da, hech qanday rasmiy maqomga ega emas: ular hech qanday kafolat bilan ta'minlanmaydi. Agar tarjima va (joriy rasmiy) ingliz tilidagi versiya o'rtasida farq bo'lsa, ingliz tilidagi versiyadan foydalanish kerak."
    translations: 'Tarjimalar'
    current: 'Joriy'
    old: 'Eski'
    table_elements:
      version: 'Versiya'
      language: 'Til'
    translating: 'Qoidalarni tarjima qilish'
    paragraph3_html: 'Agar tarjima qo''shish/yangilashga qiziqsangiz, iltimos, <a href="https://github.com/thewca/wca-regulations-translations#translation-instructions">tarjimalar uchun GitHub repozitoriysidagi ko''rsatmalarni</a> ko''ring.'

    officers_and_board:
      title: "WCA mansabdor shaxslari va kengashi"
      officers_description: "WCA mansabdor shaxslari WCA ning notijorat maqomi bilan bog'liq vazifalarni bajaradilar. Bu mansabdor shaxslar WCA Kengashi tomonidan saylanadi. Ijrochi direktor WCA ning Bosh ijrochi direktori hisoblanadi, Rais barcha Kengash yig'ilishlariga raislik qiladi, Kotib tashkilot hujjatlarini yuritadi, G'aznachi esa WCA ning moliyaviy masalalarini boshqaradi."
      board_description: "WCA Kengashi tashkilotni umumiy boshqarish va boshqa Jamoalar va Qo'mitalar tomonidan bajarilmagan har qanday vazifalarni bajarish uchun javobgardir"
    teams_committees_councils:
      title: "WCA Jamoalari va Qo'mitalari"
      description: "WCA ning jamoalari va qo'mitalari tashkilotning ajralmas qismi bo'lib, uning faoliyatini ta'minlash uchun zarur bo'lgan kundalik vazifalarni bajaradilar. Bu qo'mitalar WCA hamjamiyati a'zolaridan, jumladan WCA delegatlari va ishtirokchilardan tashkil topgan. Har bir jamoaning rahbari bor, uning vazifasi jamoaning to'g'ri ishlashini ta'minlash va boshqa jamoa a'zolariga yo'l-yo'riq ko'rsatishdan iborat. Jamoa yoki qo'mitada bo'sh o'rinlar paydo bo'lganda, qanday ariza topshirish haqidagi ma'lumot bosh sahifada e'lon qilinadi."
      contact_button: "Bog'lanish"
      no_contact_description: "Bu jamoa/qo'mitaning bog'lanish ma'lumotlari ommaga ochiq emas."
      groups_name:
        wat: "WCA Arxiv jamoasi"
        wct: "WCA Kommunikatsiya jamoasi"
        wcat: "WCA Musobaqa e'lon qilish jamoasi"
        wic: "WCA Halollik qo'mitasi"
        weat: "WCA Ijrochi yordamchilari jamoasi"
        wfc: "WCA Moliya qo'mitasi"
        wmt: "WCA Marketing jamoasi"
        wmct: "WCA Yirik chempionatlar jamoasi"
        wqac: "WCA Sifat nazorati qo'mitasi"
        wrc: "WCA Qoidalar qo'mitasi"
        wrt: "WCA Natijalar jamoasi"
        wst: "WCA Dasturiy ta'minot jamoasi"
        wsot: "WCA Sport tashkiloti jamoasi"
        wapc: "WCA Apellyatsiya qo'mitasi"
      groups_description:
        wat: "WCA Arxiv jamoasi (WAT) WCA ning tarixiy arxivi rivojlanishi va saqlanishini boshqaradi. Ular asosiy speedsolving voqealari va WCA ning muhim bosqichlarini hujjatlashtirib, WCA ning speedsolving sohasidagi merosini saqlab qolish maqsadida kengroq WCA xronologiyasining bir qismi sifatida taqdim etadilar."
        wct: "WCA Kommunikatsiya jamoasi (WCT) WCA ning hamjamiyat va keng jamoatchilik bilan aloqalarini nazorat qiladi va qo'llab-quvvatlaydi. WCA ning kommunikatsiyasi WCA maqsadlariga hissa qo'shishi va do'stona munosabat, shaffoflik, inklyuzivlik, ochiqlik va javobgarlik kabi umumiy ijobiy madaniyatni qo'llab-quvvatlashi kerak."
        wcat: "WCA Musobaqa e'lon qilish jamoasi (WCAT) WCA delegatlari tomonidan taqdim etilgan WCA musobaqalarini tasdiqlaydi va e'lon qiladi hamda bunday e'lonlar WCA sifat standartlariga mos kelishini ta'minlaydi. Bu jamoa, shuningdek, WCA Musobaqa talablari siyosati kabi hujjatlardan kelib chiqqan holda to'g'ri musobaqa topshirish protokolini yuritish uchun javobgardir. WCAT alohida musobaqalarni tashkil qilish va delegat qilish uchun javobgar EMAS."
        wic: "WCA Halollik qo'mitasi (WIC) WCA hamjamiyati a'zolari va WCA musobaqalarida yoki rasmiy, onlayn WCA platformalarida sodir bo'lgan hodisalar bo'yicha mustaqil tekshiruvlar o'tkazadi. Bu hodisalar WCA ning Qadriyatlari, Xulq-atvor kodeksi, Etika kodeksi va/yoki Qoidalarining da'vo qilingan buzilishlaridir."
        weat: "WCA Ijrochi yordamchilari jamoasi (WEAT) WCA Direktorlar kengashining ma'muriy vazifalarini bajaradi."
        wfc: "WCA Moliya qo'mitasi (WFC) WCA ning umumiy moliyasini, jumladan byudjetlashtirish, hisobot berish, tahlil qilish, buxgalteriya hisobi va soliq deklaratsiyalarini boshqaradi. Ular, shuningdek, WCA ning eng katta daromad manbai bo'lgan WCA To'lovlar tizimini va rivojlanishning turli bosqichlarida mahalliy hamjamiyatlarni qo'llab-quvvatlaydigan turli moliyalashtirish dasturlarini, jumladan Sayohat moliyalashtirish, Jihozlar moliyalashtirish va Hududiy tashkilotlarni qo'llab-quvvatlashni boshqaradi."
        wmt: "WCA Marketing jamoasi (WMT) WCA brendini boshqaradi, homiyliklarni izlaydi va WCA tovarlarini marketing qiladi."
        wmct: "WCA Yirik chempionatlar jamoasi (WMCT) yo'l-yo'riq va strategik rejalarni ishlab chiqish, mezbon shahar tanlovini boshqarish, tashkiliy jamoalarni qo'llab-quvvatlash va chempionat tajribalarining izchilligini ta'minlash orqali WCA Qit'a va Jahon chempionatlarini muvofiqlashtirish va rivojlantirishni nazorat qiladi."
        wqac: "WCA Sifat nazorati qo'mitasi (WQAC) WCA ichida doimiy sifat yaxshilanishini, shuningdek jarayonlar, WCA ko'ngillilari, Hududiy tashkilotlar, Musobaqa tashkilotchilari va Musobaqa ko'ngillilarining izchil yuqori sifatini ta'minlash uchun sifat standartlarini butun dunyo bo'ylab qo'llashni rag'batlantiradi."
        wrc: "WCA Qoidalar qo'mitasi (WRC) WCA Qoidalarini qo'llash, yaxshilash va rivojlantirish bilan bog'liq barcha masalalarni hal qiladi. Ular WCA delegatlarini musobaqalarda sodir bo'ladigan har qanday protsedura masalalarida qo'llab-quvvatlaydi va hal qilinmagan va qamrab olinmagan hodisalar bo'yicha qaror qabul qiladi."
        wrt: "WCA Natijalar jamoasi (WRT) WCA ma'lumotlar bazalaridagi barcha ma'lumotlarni, jumladan musobaqa natijalari va shaxslar ma'lumotlarini boshqaradi."
        wst: "WCA Dasturiy ta'minot jamoasi (WST) WCA ning dasturiy ta'minotini (veb-sayt, skramblerlar, ish kitoblari, admin vositalari) boshqaradi."
        wsot: "WCA Sport tashkiloti jamoasi (WSOT) WCA ning xalqaro sport tashkiloti sifatida tan olinishini nazorat qiladi va qo'llab-quvvatlaydi."
        wapc: "WCA Apellyatsiya qo'mitasi (WAC) boshqa WCA ko'ngillilari tomonidan qabul qilingan qarorlar bo'yicha apellyatsiyalarni ko'rib chiqadi va hal qiladi. WAC qarorlarning adolatli, asosli va WCA siyosati va qoidalariga muvofiq bo'lishini ta'minlash uchun mustaqil va xolis ko'rib chiqish jarayonini taqdim etadi."

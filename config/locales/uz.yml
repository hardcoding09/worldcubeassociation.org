          base_entry_fee: 'Musobaqa uchun asosiy ro''yxatdan o''tish to''lovi. U musobaqa ma''lumot sahifasida va agar foydalanilsa, ro''yxatdan o''tish sahifasida ko''rsatiladi. Agar bu 0 ga o''rnatilsa, ro''yxatdan o''tishlar bepul qabul qilinishini bildiruvchi jumla ko''rsatiladi. <br><br><b>OGOHLANTIRISH: Quyidagi WCA to''lovlari taxmini faqat joriy valyuta kurslariga asoslangan taxmin bo''lib, to''lovlarni to''lash uchun hech qanday huquqiy kuchga ega emas.</b>'
          on_the_spot_entry_fee: "Agar bu 0 ga o'rnatilsa, joyida ro'yxatdan o'tishlar bepul qabul qilinishini bildiruvchi jumla ko'rsatiladi."
          guest_entry_fee: "Hozircha bu raqam faqat ma'lumot uchun, mehmon to'lovlarini bu veb-sayt orqali boshqarib bo'lmaydi. Agar bu 0 ga o'rnatilsa, tomoshabin siyosati haqida siz tanlagan jumla ko'rsatiladi."
          refund_policy_percent: "Hozircha bu raqam faqat ma'lumot uchun, to'lovlarni qaytarish qo'lda amalga oshirilishi kerak bo'ladi. Agar bu 0 ga o'rnatilsa, ro'yxatdan o'tish to'lovlari hech qanday holatda qaytarilmasligini bildiruvchi jumla ko'rsatiladi."
          refund_policy_limit_date: "Bu sanadan keyin boshqa to'lovlar qaytarilmaydi."
        registration:
          opening_date_time: "Eslatma: Ro'yxatdan o'tish ochilishi va yopilishi UTC vaqtida"
          waiting_list_deadline_date: "Kutish ro'yxatidagi ro'yxatdan o'tganlar endi qabul qilinmaydigan sana. Agar to'lovlarni qaytarish uchun muddatingiz bo'lsa, qabul qilinish muddati to'lovlarni qaytarish muddatidan oldin bo'lmasligi kerak."
          event_change_deadline_date: "Ro'yxatdan o'tgan ishtirokchilar tashkiliy jamoa bilan bog'lanib, shu vaqtgacha ro'yxatdan o'tgan yo'nalishlarini yangilash huquqiga ega. Bu muddat ro'yxatdan o'tish yopilishidan oldin belgilanmasligi kerak. Bu maydonni bo'sh qoldirish ishtirokchilar yo'nalish o'tkazilgunga qadar ro'yxatdan o'tgan yo'nalishlariga yo'nalish qo'shishlari mumkinligini anglatadi. Agar joyida ro'yxatdan o'tishingiz bo'lsa, bu musobaqa bilan bir xil kunga belgilanishi kerak."
          guests_per_registration: "Bu musobaqada har bir ro'yxatdan o'tish uchun ruxsat etilgan mehmonlar soni. Juda ko'p mehmonli ro'yxatdan o'tish bloklanadi. Agar limit bo'lmasa, bo'sh qoldiring."
          extra_requirements: "Iltimos, bu yerda yuqorida qamrab olinmagan har qanday qo'shimcha ro'yxatdan o'tish talablarini ko'rsating, masalan, qanday to'lash bo'yicha ko'rsatmalar. <br/>Iltimos, buni <b>ingliz tilida</b> va ishtirokchilaringiz so'zlashadigan boshqa tillarda to'ldiring; bu musobaqaning ma'lumot sahifasida, shuningdek agar WCA veb-sayti ro'yxatdan o'tishlaridan foydalanayotgan bo'lsangiz, ro'yxatdan o'tish sahifasida ko'rsatiladi."
        event_restrictions:
          forbid_newcomers:
            reason: "Iltimos, bu yerda nega yangi kelganlarning musobaqangizga ro'yxatdan o'tishini istamasligingizni tushuntiring. Iltimos, buni ingliz tilida to'ldiring!"
          early_puzzle_submission:
            reason: "Iltimos, bu yerda nega ishtirokchilardan kublarni erta topshirishni talab qilishni xohlayotganingizni tushuntiring. Iltimos, buni ingliz tilida to'ldiring!"
          qualification_results:
            reason: "Iltimos, bu yerda nega saralash natijalaridan foydalanmoqchi ekanligingizni tushuntiring. Iltimos, buni ingliz tilida to'ldiring!"
          event_limitation:
            reason: "Iltimos, bu yerda nega muayyan yo'nalish kombinatsiyalarini cheklamoqchi ekanligingizni tushuntiring. Iltimos, buni ingliz tilida to'ldiring!"
            per_registration_limit: "Ixtiyoriy ravishda ishtirokchi ro'yxatdan o'tishi mumkin bo'lgan yo'nalishlarning umumiy sonini cheklang (odatda \"Sevimlilar\" musobaqalari uchun ishlatiladi). Bu maydondan foydalanishdan oldin yo'nalishlarni qo'shishingiz kerak. Juda ko'p yo'nalishli ro'yxatdan o'tishlar bloklanadi. Agar limit bo'lmasa, bo'sh qoldiring."
          main_event_id: "Bu yo'nalishning g'olibi musobaqaning g'olibi bo'ladi."
        remarks: "WCAT ga yetkazmoqchi bo'lgan qo'shimcha ma'lumotlar. Masalan, agar biror narsaga ishonchingiz komil bo'lmasa yoki WCAT uchun maxsus so'rovlar bo'lsa. Iltimos, buni ingliz tilida to'ldiring!"

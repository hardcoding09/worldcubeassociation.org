  #context: FAQ page
  faq:
    title: "Ko'p beriladigan savollar"
    contact_html: "Agar bu javoblardan birortasi yordam bermagan bo'lsa, iltimos, %{contact_us}!"
    contact_us: "biz bilan bog'laning"
    search_for_competition: "Bu yerda musobaqani qidiring:"
    already_logged_in: "Siz allaqachon WCA hisobi bilan tizimga kirgansiz."
    create_an_account: "Hisobni %{here} yaratishingiz mumkin."
    claim_your_wca_id: "WCA ID ingizni %{here} da'vo qilishingiz mumkin."
    create_an_account_and_claim: "Hisobni %{here} yarating. Yangi hisobingiz bilan tizimga kirganingizdan so'ng, sizdan WCA ID ingizni da'vo qilish so'raladi."
    answers:
      '1':
        title: "Qanday qilib WCA ID va WCA profiliga ega bo'laman?"
        #context: Answer to "How do I obtain a WCA ID..."
        content:
          '1': "Agar siz hech qachon qatnashmagan bo'lsangiz, <a href='/competitions'>musobaqa</a>ga boring! Birinchi musobaqangiz natijalari e'lon qilinganda siz uchun WCA ID va WCA profili yaratiladi."
      '2':
        #context: Answer to "How can I find a WCA competition"
        title: "WCA musobaqasini qanday topaman?"
        content:
          '1': "<a href='/competitions'>Musobaqalar</a> ro'yxatimizni ko'rib chiqing"
      '3':
        #context: Answer to "How can I register for a competition? ..."
        title: "Musobaqa uchun qanday ro'yxatdan o'taman? Musobaqaga ro'yxatdan o'tishda muammolar bo'lsa, kimga murojaat qilishim mumkin?"
        content:
          '1': "Ko'p musobaqalar ro'yxatdan o'tishni shu yerda, WCA veb-saytida amalga oshiradi, lekin ba'zilari o'z tizimlaridan foydalanadi. Batafsil ma'lumot uchun qatnashmoqchi bo'lgan musobaqangiz tashkilotchilari bilan bog'lanishingiz kerak. %{comp_search_form}"
      '4':
        title: "WCA musobaqasida qatnashish uchun qanday talablar bor? WCA musobaqasida qatnashishdan oldin nimalarni bilishim kerak?"
        #context: Answer to "What are the requirements for attending a WCA competitions? ..."
        content:
          '1': "Umuman olganda, WCA musobaqasida qatnashish uchun ko'p talablar yo'q. Biroq, musobaqaning barcha ishtirokchilaridan <a href='https://www.worldcubeassociation.org/regulations/'>WCA Qoidalarini</a> yaxshi tushunishlari kutiladi. Agar ingliz tili sizning birinchi tilingiz bo'lmasa va hujjatni tushunishda qiyinchilik bo'lsa, iltimos, <a href='https://www.worldcubeassociation.org/regulations/translations/'>Tarjimalarni</a> o'qing."
      '5':
        title: "O'z shahrimda WCA musobaqasini qanday o'tkazishim mumkin?"
        #context: Paragraph of the answer to "How can I have a WCA competition in my hometown?"
        content:
          '1': "Agar siz musobaqa tashkil qilishga qiziqsangiz, tajriba orttirish uchun kamida bir yoki ikki musobaqada ishtirokchi sifatida qatnashish juda tavsiya etiladi."
          '2': "WCA musobaqalari <a target='_blank' href='https://www.worldcubeassociation.org/regulations/'>WCA Qoidalariga</a> amal qilishi kerak. Tashkiliy jamoa qoidalarni yoddan bilishi shart emas, biroq qoidalarning asoslarini chuqur bilish musobaqani to'g'ri tashkil qilishda albatta yordam beradi."
          '3': "Shundan so'ng, tashkiliy jamoa yaqin atrofdagi <a target='_blank' href='https://www.worldcubeassociation.org/delegates'>WCA delegati</a> bilan bog'lanishi kerak. Musobaqani WCA tomonidan rasman tasdiqlangan qilish uchun WCA delegatining nazorati talab qilinadi. WCA delegati muvaffaqiyatli musobaqani qanday o'tkazish bo'yicha tashkilotga yo'l-yo'riq ko'rsatishga yordam beradi."
          '4': "Qo'shimcha ma'lumot uchun <a target='_blank' href='https://documents.worldcubeassociation.org/edudoc/organizer-handbook/organizer-handbook.pdf'>WCA Musobaqa tashkilotchisi qo'llanmasi</a>ga tashrif buyuring."
      '6':
        title: "WCA hisoblari nima uchun kerak? WCA hisoblari va WCA profillari o'rtasidagi farq nima?"
        #context: Paragraph of the answer to "What are the WCA accounts for? ..."
        content:
          '1': "Birinchi WCA tomonidan tasdiqlangan musobaqangiz natijalari e'lon qilinganda sizga WCA ID tayinlanadi."
          '2': "WCA hisoblari sizga bizga kimligingizni isbotlash imkonini beradi. Bu WCA profilingizga rasm qo'shish va musobaqalar uchun ro'yxatdan o'tish imkonini beradi. Bu sizni boshqalarning sizning nomingizdan o'zini ko'rsatishidan himoya qiladi."
          #context: Yup, nothing to translate here! Just hit "Use the original version"
          '3': "%{current_user_status}"
      'results':
        title: "WCA musobaqasining natijalari WCA veb-saytiga qachon yuklanadi?"
        #context: Paragraph of the answer to "When are the results of a WCA competition uploaded?"
        content:
          '1': "Musobaqa tugagandan so'ng, WCA delegati barcha natija varaqlari va shaxs ma'lumotlarini yuzaga kelishi mumkin bo'lgan xatolarni bartaraf etish uchun ikki marta tekshirishi kerak. Bu bajarilgandan so'ng, natijalar musobaqa natijalarini yuklash va WCA ma'lumotlar bazasini yuritish uchun mas'ul bo'lgan WCA Natijalar jamoasiga (WRT) yuboriladi. WRT nihoyat natijalarni imkon qadar tezroq WCA ma'lumotlar bazasiga yuklaydi."
          '2': "Musobaqaning hajmi va delegatning shaxsiy jadvaliga qarab, bularning barchasi bir kundan bir haftagacha vaqt olishi mumkin. Iltimos, sabr qiling."
          '3': "Bundan tashqari, agar WCA hisobingizni WCA ID ingiz bilan ulagan bo'lsangiz (quyida qarang), natijalaringiz topshirilishi haqida email bildirishnomalarini <a href='%{preferences_edit_path}'>bu yerda</a> yoqishingiz mumkin."
      '7':
        title: "Profil rasmini qanday o'zgartiraman?"
        #context: Paragraph of the answer to "How do I change my profile picture?"
        content:
          '1': "Avval <a href='#how-do-i-connect-my-wca-account-with-my-wca-id'>WCA hisobini yaratishingiz va uni WCA ID ingiz bilan ulashingiz kerak.</a>"
          '2': "WCA hisobingizni va WCA ID ingizni ulaganingizdan so'ng, profil rasmini o'zgartirish uchun <a href='%{profile_edit_path}'>profilni tahrirlash sahifangizga</a> o'ting."
      '8':
        title: "WCA hisobimni WCA ID im bilan qanday ulayman?"
        #context: Answer to "How do I connect my WCA account ...?"
        content:
          #context: Yup, nothing to translate here! Just hit "Use the original version"
          '1': "%{current_user_claim}"
      '9':
        title: "Men musobaqa uchun ro'yxatdan o'tganman va qo'shimcha yo'nalishga yozilmoqchiman, nima qilishim kerak? Mehmon olib kelishim mumkinmi?"
        #context: Answer to "I want to sign up for an additional event ...?"
        content:
          '1': "Iltimos, tashkilotchi bilan bog'laning. Bog'lanish ma'lumotlarini musobaqa veb-saytida topishingiz mumkin. Agar qayerdan topishni bilmasangiz, <a href='/competitions'>musobaqalar ro'yxatini</a> tekshiring."
      'regulations1':
        title: "Mening kubim musobaqa uchun qonuniymi?"
        #context: Answer to "Is my puzzle competition legal?"
        content:
          '1': "Kublarga oid qoidalarni <a href='https://www.worldcubeassociation.org/regulations/#3'>3-moddada</a> topishingiz mumkin. Barcha kublar WCA delegati tomonidan tasdiqlanishi kerak. Agar ishonchingiz komil bo'lmasa, iltimos, musobaqangiz delegatidan so'rang. Ehtiyot bo'lish uchun, foydalanishga ruxsat berilmasa, zaxira kub olib kelishingiz kerak."
      'regulations2':
        title: "Rasmiy WCA musobaqasida magnitli kubdan foydalanishim mumkinmi?"
        #context: Answer to "May I use a magnetic puzzle in an official WCA competition?"
        content:
          '1': "Agar ular <a target='_blank' href='https://www.worldcubeassociation.org/regulations/'>WCA Qoidalariga</a> mos kelsa, magnitli kublardan foydalanishingiz mumkin. Iltimos, ayniqsa <a href='https://www.worldcubeassociation.org/regulations/#3h'>3h Qoidasiga</a> e'tibor bering."
      'regulations3':
        title: "Kubimning markaz qopqog'i yoki bo'lagini yo'qotdim. Undan hali ham foydalanishim mumkinmi?"
        #context: Answer to "Am I allowed to use damaged puzzles?"
        content:
          '1': "Bu kubdan foydalanishga ruxsat berilmagan. Kublarda biron bir bo'lakni o'xshash bo'lakdan sezilarli darajada ajratib turadigan hech qanday shikast yoki boshqa farqlar bo'lmasligi kerak (<a href='https://www.worldcubeassociation.org/regulations/#3j'>3j Qoidasiga</a> qarang)."
      'regulations4':
        title: "WCA musobaqasi uchun ro'yxatdan o'tish uchun necha yoshda bo'lishim kerak?"
        #context: Answer to "How old do I have to be ...?"
        content:
          '1': "Minimal yosh yo'q. Biroq, ro'yxatdan o'tishdan oldin ota-onangizdan so'rashingiz kerak (<a href='https://www.worldcubeassociation.org/regulations/#2b'>2b Qoidasiga</a> qarang)."
  #context: About the WCA
  about:
    title: "WCA haqida"
    mission_statement: "Bizning maqsadimiz global speedsolving hamjamiyatini qo'llab-quvvatlash va barcha uchun qiziqarli va adolatli raqobat muhitini saqlab qolishdir."
    mission_footer: "WCA Maqsad bayonoti"
    who_we_are_title: "Biz kimmiz"
    who_we_are_content_html: <p>World Cube Association (WCA) — bu "twisty puzzles" deb nomlanuvchi, bo'laklar guruhini burash orqali boshqariladigan mexanik boshqotirmalar bo'yicha musobaqalarni boshqaruvchi tashkilotdir. Bu boshqotirmalarning eng mashhuri — Vengriyalik professor Rubik tomonidan ixtiro qilingan Rubik kubidir. Bu boshqotirmalardan bir qanchasi WCA ning rasmiy yo'nalishlari sifatida tanlangan.</p>
      <p>WCA so'nggi o'n yil ichida rivojlanib borgan sari, 245 000 dan ortiq kishi bizning musobaqalarimizda qatnashdi. Bu o'sishga qaramay, biz deyarli butunlay ko'ngillilar tomonidan boshqariladigan tashkilot bo'lib qolmoqdamiz — mahalliy tashkilotchilardan tortib WCA delegatlarigacha, hatto WCA Kengashigacha. WCA ning faoliyat yuritishiga imkon berish uchun o'z hayotlaridan vaqt ajratadigan barchaga juda minnatdormiz. Ko'proq moliyaviy qo'llab-quvvatlash bilan, butun dunyo bo'ylab ko'proq tadbirlarni tasdiqlashda davom etar ekanmiz, musobaqalarimizga yanada yuqori darajadagi professionallik olib kelishni umid qilamiz.</p>
    spirit: "Bizning Qadriyatlarimiz — Hamjamiyat, Adolat, Qiziqarli, Mukammallik va Ko'ngillilik."
    spirit_footer: "WCA Qadriyatlari"
    our_goals_title: "Bizning maqsadlarimiz"
    our_goals_content_html: <p>World Cube Association "twisty puzzle" musobaqalarimizning qulayligini oshirish orqali butun dunyo bo'ylab yoshlarga hamjamiyat a'zoligi va yetakchilik imkoniyatlarini taqdim etishni xohlaydi. Biz musobaqalardagi va hamjamiyatimizdagi tajribalar jalb qilingan yoshlar uchun o'sish imkoniyatlarini yaratishiga va boshqotirma tadbirlarini yangi guruhlarga tanishtirish umumiy hamjamiyatimizni mustahkamlashga imkon berishiga ishonamiz. Kengashning WCA uchun Strategik rejasini o'z ichiga olgan hujjatni <a href="https://documents.worldcubeassociation.org/documents/WCA_Strategic_Plan.pdf">bu yerda</a> topishingiz mumkin.</p>
    whats_next_title: "WCA uchun keyingi nima?"
    whats_next_content_html: <p>World Cube Association 158 ta turli hududda 245 000 dan ortiq noyob ishtirokchiga ega bo'ldi va biz yaqin orada sekinlashishni rejalashtirmayapmiz! Kub hamjamiyati 2004 yilda tashkil topganimizdan beri barqaror o'sib bormoqda va biz musobaqalarning yangi hududlarga qulayligini oshirish orqali bu kelajakda ham davom etishini rag'batlantirishni xohlaymiz. Kelajakda biz boshqotirmalarga qiziqadiganlar bilan hamkorlik va aloqa orqali hamjamiyatimizni yanada ko'proq qo'llab-quvvatlashni umid qilamiz.</p>
    world_championship_title: "Jahon chempionati"
    world_championship_content_html: <p>Har ikki yilda bir marta biz jahon chempionini belgilaydigan musobaqani tasdiqlaymiz. Bu tadbirlar bir qator ko'ngillilar tomonidan nihoyatda ehtiyotkorlik bilan rejalashtirishni, shuningdek joyni band qilish va zarur tayyorgarliklarni amalga oshirish uchun katta moliyaviy mablag'ni talab qiladi.</p>
    contributing_title: "Hissa qo'shish"
    contributing_content_html: 'Guidestar orqali kredit karta bilan %{here_credit} yoki PayPal orqali %{here_paypal} xayriya qilishingiz mumkin. Agar chek yozishni afzal ko''rsangiz, quyidagi manzilga yozishingiz mumkin:'
    tax_deductible_note: "Xayriyalar Qo'shma Shtatlarda soliqdan chegiriladi."
    other_help_title: "Yordam berishning boshqa usullari"
    other_help_content_html: '<p>Agar World Cube Association ga moliyaviy bo''lmagan usulda hissa qo''shishingiz mumkin deb hisoblasangiz, sizdan eshitishni juda xohlaymiz! Iltimos, <a href="mailto:communication@worldcubeassociation.org">communication@worldcubeassociation.org</a> manzili orqali biz bilan bog''laning.</p>'
    donation_banner:
      content: "World Cube Association 501(c)(3) soliqdan ozod tashkilotdir. 100% ko'ngillilar tomonidan boshqariladigan notijorat tashkilot sifatida biz sizning xayriyalaringizni mamnuniyat bilan qabul qilamiz — bu butun dunyo bo'ylab yanada qiziqarli musobaqalarga ega bo'lish vizyonimizni qo'llab-quvvatlashga yordam beradi."
      donate_credit: "Kredit karta orqali xayriya qilish"
      donate_paypal: "PayPal orqali xayriya qilish"
      donate_other: "Xayriya qilishning boshqa usullari"
    structure:
      title: "Tuzilma"
      board:
        description: "WCA Kengashi tashkilotni umumiy boshqarish va boshqa Jamoalar va Qo'mitalar tomonidan bajarilmagan har qanday vazifalarni bajarish uchun javobgardir"
      users:
        profile: "%{user_name} profili"
      operations_html: "Kundalik faoliyat WCA ning %{committees_and_teams} tomonidan boshqariladi."
      teams_committees: "Jamoalar va Qo'mitalar"
      delegates_html: "<p><strong>WCA delegati</strong> — bu WCA Harakatlarida belgilangan va WCA Qoidalarida tasvirlangan rol. Delegatning asosiy vazifasi WCA nomidan musobaqalarni nazorat qilishdir. WCA delegati barcha WCA musobaqalari WCA ning Maqsadi, Qadriyatlari va Qoidalariga muvofiq o'tkazilishiga ishonch hosil qilish uchun javobgardir. WCA <strong>Katta delegatlar</strong>, <strong>Hududiy delegatlar</strong>, <strong>To'liq delegatlar</strong>, <strong>Kichik delegatlar</strong> va <strong>Delegat stajyorlar</strong>%{see_link} o'rtasida farqlaydi.</p>
<p>WCA delegati vazifalaridan tashqari, Katta delegat yoki Hududiy delegat o'z hududidagi WCA delegatlarini boshqarish uchun javobgardir va hududiy masalalar bo'yicha hamjamiyat tomonidan bog'lanishi mumkin.</p>
<p>Yangi delegatlar dastlab Kichik delegatlar sifatida ro'yxatga olinadi; keyin WCA delegatlariga ko'tarilishdan oldin ular WCA musobaqalarini boshqarishda malakali ekanliklarini ko'rsatishlari so'raladi.</p>
<p>Delegat stajyorlar WCA delegati lavozimiga o'qitilmoqda va faqat WCA delegati ishtirok etgan musobaqalarni nazorat qilishlari mumkin.</p>"
      see_link_html: " (%{link} ga qarang)"
      members_html: "Barcha ishtirokchilar birinchi WCA musobaqasida avtomatik ravishda WCA ning <strong>a'zolariga</strong> aylanadilar."

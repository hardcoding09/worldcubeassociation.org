      list:
        '1': "Tashkilot hududida WCA musobaqalarini faol ravishda tashkil qilish yoki qo'llab-quvvatlash"
        '2': "Tegishli Tashkiliy jamoa tomonidan talab qilinsa, Hududiy tashkilotning qit'asida o'tkaziladigan Qit'a WCA musobaqalariga hissa qo'shish"
        '3': "WCA Nizomi va Harakatlarida belgilangan Maqsadlarni hurmat qilish va amalda qo'llash"
        '4': "Barcha amaldagi WCA Qoidalariga rioya qilish"
        '5': "WCA ko'ngillilarining qarorlarini qabul qilish va ularga rioya qilish"
        '6': "WCA da o'zining joriy nizomi va agar mavjud bo'lsa, qoidalarining elektron formatdagi nusxasini saqlash"
